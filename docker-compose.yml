version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votacao-postgres
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: votacao
      POSTGRES_PASSWORD: votacao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votacao"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: votacao-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/votacao
      DATABASE_USERNAME: votacao
      DATABASE_PASSWORD: votacao
      BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    profiles:
      - full

volumes:
  postgres_data:
