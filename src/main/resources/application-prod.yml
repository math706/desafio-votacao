spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/votacao}
    username: ${DATABASE_USERNAME:votacao}
    password: ${DATABASE_PASSWORD:votacao}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.votacao: INFO
    org.springframework.web: INFO
