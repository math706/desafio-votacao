spring:
  application:
    name: desafio-votacao
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

votacao:
  base-url: ${BASE_URL:http://localhost:8080}
  sessao:
    duracao-padrao-minutos: 1
